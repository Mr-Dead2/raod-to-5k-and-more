include ':app'
include ':capacitor-cordova-android-plugins'
// Local Capacitor plugin (Health Connect import). Not generated by `cap sync`
// — it lives in this repo, so it is wired up by hand here and in app/build.gradle.
include ':health-connect'
project(':health-connect').projectDir = new File('./health-connect/')
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'