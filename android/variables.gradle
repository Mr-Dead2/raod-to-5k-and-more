ext {
    // 26 (Android 8.0), not Capacitor's default 22: androidx.health.connect's
    // client library is API 26+, and the app has always relied on notification
    // channels, which are an API 26 feature too.
    minSdkVersion = 26
    kotlin_version = '1.9.10'
    // 1.1.0-alpha07, not a later one. There is no stable 1.0.0 — that line ran
    // 1.0.0-alpha.. to 1.0.0-rc02 and then jumped straight to the 1.1.0 alphas,
    // so `1.0.0` resolves to nothing. The 1.1.0 line's later releases (beta01
    // onward, and 1.1.0 stable from Oct 2025) are built against newer platform
    // SDKs than this project's pinned compileSdk 34 / AGP 8.2.1 toolchain.
    // alpha07 is the January 2024 release from that same era and already has
    // everything the bridge uses: ExerciseSessionRecord, aggregate(),
    // getSdkStatus() and createRequestPermissionResultContract().
    healthConnectVersion = '1.1.0-alpha07'
    coroutinesVersion = '1.7.3'
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}